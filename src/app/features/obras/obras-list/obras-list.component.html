<div class="page-container fade-in-up">
  <div class="page-header">
    <div>
      <h1>Obras</h1>
      <p>Listado de obras cargadas en el sistema</p>
    </div>

    <button mat-raised-button color="primary" (click)="nuevaObra()">
      <mat-icon>add</mat-icon>
      Nueva obra
    </button>
  </div>

  <div class="card table-card">
    <table mat-table [dataSource]="obras">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let o">{{ o.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let o">{{ o.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="expediente">
        <th mat-header-cell *matHeaderCellDef>Expediente</th>
        <td mat-cell *matCellDef="let o">{{ o.expediente ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="municipio">
        <th mat-header-cell *matHeaderCellDef>Municipio</th>
        <td mat-cell *matCellDef="let o">{{ o.municipio ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let o">
          <span class="badge-activo activo">
            {{ o.estado ?? 'Cargada' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let o">
          <button mat-icon-button (click)="editarObra(o.id)" matTooltip="Editar / continuar carga">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="imprimirCaratula(o.id)" matTooltip="Imprimir carátula / PDF">
            <mat-icon>print</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    @if (obras.length === 0 && !cargando) {
      <div class="empty-state">
        <mat-icon>engineering</mat-icon>
        <p>No hay obras registradas</p>
      </div>
    }
  </div>
</div>
