<div class="wizard-container">
  <div class="steps">
    <div class="step-item" [class.active]="currentStep === 1" [class.completed]="obraId" (click)="goToStep(1)">
      <div class="step-circle">1</div>
      <div class="step-label">Datos básicos</div>
    </div>

    <div class="step-line"></div>

    <div class="step-item" [class.active]="currentStep === 2" (click)="goToStep(2)">
      <div class="step-circle">2</div>
      <div class="step-label">Adjudicación</div>
    </div>
    <div class="step-line"></div>

    <div class="step-item" [class.active]="currentStep === 3"
      (click)="goToStep(3)">
      <div class="step-circle">3</div>
      <div class="step-label">Cómputo</div>
    </div>

    <div class="step-line"></div>

    <div class="step-item" [class.active]="currentStep === 4"
      (click)="goToStep(4)">
      <div class="step-circle">4</div>
      <div class="step-label">Ejecución</div>
    </div>

    <div class="step-line"></div>

    <div class="step-item" [class.active]="currentStep === 5" (click)="goToStep(5)">
      <div class="step-circle">5</div>
      <div class="step-label">Certificación</div>
    </div>
  </div>

  <div class="step-content">
    @if (currentStep === 1) {
    <app-step-datos-basicos
    [obra]="obra"
    [obraId]="obraId"
    (obraSaved)="saveObra($event)">
  </app-step-datos-basicos>
    }

    @if (currentStep === 2) {
   <app-step-contrato
  [obraId]="obraId"
  [obra]="obra"
  (adjudicacionCreated)="saveAdjudicacion($event)">
</app-step-contrato>

    }
    @if (currentStep === 3) {
    <app-step-rubros
      [obraId]="obraId"
      [obra]="obra"
      (rubrosSaved)="rubrosGuardados()">
    </app-step-rubros>
    }
    @if (currentStep === 4) {
    <app-step-ejecucion [obraId]="obraId" [obra]="obra" (ejecucionSaved)="currentStep = 5"></app-step-ejecucion>
    }
    @if (currentStep === 5) {
    <app-step-certificacion [obraId]="obraId"></app-step-certificacion>
    }
  </div>
</div>
